name: Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # allegare il bundle alla release sui tag v*

jobs:
  flatpak:
    runs-on: ubuntu-latest
    # Il runtime freedesktop 25.08 include SDL3, SDL3_ttf e fontconfig
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # Su alcuni runner l'overlayfs del container non permette di rinominare le cartelle che
      # vengono dall'immagine ("Invalid cross-device link"): l'aggiornamento dell'SDK fallisce e
      # flatpak-builder va in crash. Copiando le installazioni Flatpak tutto finisce nello strato
      # scrivibile del container e l'aggiornamento funziona.
      - name: Make the Flatpak installations writable (overlayfs workaround)
        run: |
          grep ' / ' /proc/mounts || true
          done_dirs=""
          for d in /var/lib/flatpak "$HOME/.local/share/flatpak" /root/.local/share/flatpak; do
            [ -d "$d" ] && [ ! -L "$d" ] || continue
            case " $done_dirs " in *" $d "*) continue ;; esac
            done_dirs="$done_dirs $d"
            echo "copy-up: $d ($(du -sh "$d" | cut -f1))"
            cp -a "$d" "$d.copy-up" && rm -rf "$d" && mv "$d.copy-up" "$d"
          done
          flatpak --installations
          flatpak list --runtime --columns=application,branch,installation

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ribalta.flatpak
          manifest-path: packaging/flatpak/io.github.ginteaa.Ribalta.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Attach to the release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ribalta.flatpak
