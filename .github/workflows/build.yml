name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Arch Linux: SDL3 e SDL3_ttf sono disponibili come pacchetti ufficiali
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel sdl3 sdl3_ttf fontconfig ttf-dejavu pkgconf git curl util-linux

      - uses: actions/checkout@v5

      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)" || {
            echo "tag $GITHUB_REF_NAME differs from VERSION v$(cat VERSION)"; exit 1; }

      - name: Build (warnings are errors)
        run: make CFLAGS="-std=c17 -Wall -Wextra -Wpedantic -O2 -Werror"

      - name: Unit tests
        run: make test

      - name: Release build (LTO, stripped)
        run: make release

      - name: Smoke test
        run: ./ribalta --help

      - name: Install into a temporary prefix
        run: |
          make install PREFIX="$PWD/_inst"
          test -x _inst/bin/ribalta
          test -f _inst/share/applications/ribalta.desktop
          test -f _inst/share/ribalta/font.ttf
          test -f _inst/share/ribalta/ding.wav
          test -f _inst/share/icons/hicolor/scalable/apps/ribalta.svg
          test -f _inst/share/icons/hicolor/48x48/apps/ribalta.png
          test "$(_inst/bin/ribalta --version)" = "ribalta $(cat VERSION)"
          test -f _inst/share/ribalta/update.sh
          test -f _inst/share/ribalta/uninstall.sh

      - name: Update from a local release
        run: |
          set -o pipefail
          git config --global --add safe.directory "$PWD"
          T="${RUNNER_TEMP:-/tmp}"
          git archive --prefix=Ribalta-9.9.9/ -o "$T/r.tar.gz" HEAD
          printf '{"tag_name":"v9.9.9","body":"Test notes\\n- line"}' > "$T/new.json"
          printf '{"tag_name":"v%s","body":"same"}' "$(cat VERSION)" > "$T/same.json"
          rc=0
          RIBALTA_UPDATE_API="file://$T/new.json" _inst/bin/ribalta update --check || rc=$?
          test "$rc" = 10
          # inside a pseudo-terminal (script): the installer draws its progress bar only in a real
          # terminal, and that code path broke `ribalta update` in 0.7.0/0.7.1 without CI noticing
          export TERM=xterm RIBALTA_UPDATE_API="file://$T/new.json" RIBALTA_UPDATE_TARBALL="file://$T/r.tar.gz"
          script -qec "_inst/bin/ribalta update -y" /dev/null | tee "$T/update.log"
          grep -q '%' "$T/update.log"   # the progress bar was drawn
          unset TERM RIBALTA_UPDATE_API RIBALTA_UPDATE_TARBALL
          test "$(_inst/bin/ribalta --version)" = "ribalta $(cat VERSION)"   # the archive is HEAD
          RIBALTA_UPDATE_API="file://$T/same.json" _inst/bin/ribalta update --check

      - name: Uninstall keeps user data
        run: |
          echo "dummy,line" > _inst/share/ribalta/sessions.csv
          make uninstall PREFIX="$PWD/_inst"
          test -f _inst/share/ribalta/sessions.csv
          test ! -e _inst/bin/ribalta
          test ! -e _inst/share/ribalta/update.sh
          rm _inst/share/ribalta/sessions.csv

      - name: Uninstall via ribalta uninstall
        run: |
          make install PREFIX="$PWD/_inst"
          echo "dummy,line" > _inst/share/ribalta/sessions.csv
          _inst/bin/ribalta uninstall -y
          test -f _inst/share/ribalta/sessions.csv
          test ! -e _inst/bin/ribalta
          test ! -e _inst/share/ribalta/update.sh
          test ! -e _inst/share/ribalta/uninstall.sh
