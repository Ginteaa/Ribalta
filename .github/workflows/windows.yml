name: windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write   # allegare zip e setup alla release sui tag v*

jobs:
  build:
    runs-on: windows-latest
    # tutti i comandi girano in una shell MSYS2 UCRT64 (gcc, make, pkg-config come su Linux)
    defaults:
      run:
        shell: msys2 {0}
    env:
      # il runner ha una sessione grafica: l'avvio di prova usa il driver video e il renderer
      # scelti dall'app, come su un PC vero; solo l'audio e' finto (nessuna scheda sul runner)
      SDL_AUDIO_DRIVER: dummy
    steps:
      # senza questo il checkout converte i fine riga in CRLF e rompe Makefile e file VERSION
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-sdl3-ttf

      - name: Build (warnings are errors)
        run: make CFLAGS="-std=c17 -Wall -Wextra -Wpedantic -O2 -Werror"

      - name: Unit tests
        run: make test

      - name: Smoke test (command line)
        run: |
          # app GUI (-mwindows): l'output arriva solo se stdout/stderr sono un file o una pipe
          # (come qui). Il CRT di Windows scrive i fine riga come \r\n: si tolgono prima di confrontare.
          rc=0
          ./ribalta.exe --version > version.txt 2>&1 || rc=$?
          echo "exit code: $rc"
          echo "--- output"; cat version.txt; echo "---"
          test "$rc" -eq 0
          test "$(tr -d '\r' < version.txt)" = "ribalta $(cat VERSION)"

          rc=0
          ./ribalta.exe --help > help.txt 2>&1 || rc=$?
          echo "--help: exit code $rc"
          test "$rc" -eq 0
          grep -q "Uso: ribalta" help.txt

          # su Windows update e uninstall non fanno nulla: spiegano come fare e finiscono con 1
          for cmd in update uninstall; do
            rc=0
            ./ribalta.exe $cmd > "$cmd.txt" 2>&1 || rc=$?
            echo "$cmd: exit code $rc"; cat "$cmd.txt"
            test "$rc" -eq 1
          done
          grep -q "releases/latest" update.txt
          grep -q "disinstalla Ribalta" uninstall.txt

          # opzione sconosciuta: messaggio, uso e uscita 2
          rc=0
          ./ribalta.exe --opzione-inesistente > bad.txt 2>&1 || rc=$?
          echo "opzione sconosciuta: exit code $rc"; cat bad.txt
          test "$rc" -eq 2
          grep -q "opzione sconosciuta" bad.txt

      - name: Embedded resources (manifest, icon, version)
        run: |
          # ribalta.rc: icona, manifest UTF-8/DPI e VERSIONINFO devono stare nell'exe GUI
          objdump -h ribalta.exe | grep -F ".rsrc"
          objdump -p ribalta.exe | grep -i "Subsystem" | grep -F "Windows GUI"
          rsrc=$(objdump -h ribalta.exe | awk '$2 == ".rsrc" { print "0x" $3 }')
          echo ".rsrc size: $((rsrc)) bytes"
          test "$((rsrc))" -gt 65536   # le sette dimensioni dell'icona da sole pesano ~370 KB
          strings -a ribalta.exe | grep -F "activeCodePage"
          strings -a ribalta.exe | grep -F "PerMonitorV2"
          strings -a -e l ribalta.exe | grep -F "Ribalta - orologio flip"
          strings -a -e l ribalta.exe | grep -F "$(cat VERSION)"

      - name: Test run
        run: |
          export XDG_CONFIG_HOME="$(cygpath -m "$(mktemp -d)")" XDG_DATA_HOME="$(cygpath -m "$(mktemp -d)")"
          RIBALTA_DEBUG=1 ./ribalta.exe > run.log 2>&1 &
          pid=$!
          sleep 3
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null || true
            taskkill //F //IM ribalta.exe > /dev/null 2>&1 || true
            wait "$pid" 2>/dev/null || true
            cat run.log; echo "::notice::$(tr '\n' '|' < run.log)"
          else
            wait "$pid" || echo "exit code $?" >> run.log
            cat run.log; echo "::error::$(tr '\n' '|' < run.log)"; exit 1
          fi

      - name: Startup with APPDATA only (no XDG variables)
        run: |
          # come su un PC vero: niente variabili XDG, le impostazioni stanno in %APPDATA%\Ribalta.
          # All'avvio l'app legge soltanto config.ini e non scrive nulla finche' non si salvano
          # le impostazioni o non finisce una sessione: si prepara quindi un config.ini con un font
          # inesistente, che l'app segnala su stderr solo se lo ha letto da %APPDATA%\Ribalta.
          unset XDG_CONFIG_HOME XDG_DATA_HOME
          appdata="$(mktemp -d)"
          mkdir -p "$appdata/Ribalta"
          printf 'font_file=C:\\nonexistent\\prova.ttf\n' > "$appdata/Ribalta/config.ini"
          cat "$appdata/Ribalta/config.ini"
          export APPDATA="$(cygpath -w "$appdata")"
          RIBALTA_DEBUG=1 ./ribalta.exe > appdata.log 2>&1 &
          pid=$!
          sleep 3
          alive=0
          if kill -0 "$pid" 2>/dev/null; then alive=1; fi
          kill "$pid" 2>/dev/null || true
          taskkill //F //IM ribalta.exe > /dev/null 2>&1 || true
          wait "$pid" 2>/dev/null || true
          cat appdata.log
          echo "--- $appdata"; find "$appdata" -type f
          test "$alive" -eq 1
          grep -q "font non trovato: C:.nonexistent.prova.ttf" appdata.log

      - name: Single instance
        run: |
          export XDG_CONFIG_HOME="$(cygpath -m "$(mktemp -d)")" XDG_DATA_HOME="$(cygpath -m "$(mktemp -d)")"
          ./ribalta.exe > first.log 2>&1 &
          pid=$!
          sleep 3
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid" || true
            cat first.log; echo "::error::la prima istanza non e' partita"; exit 1
          fi
          # la seconda deve uscire subito con 0 e dirlo (mutex Local\Ribalta gia' preso)
          start=$SECONDS
          rc=0
          timeout -s KILL 30 ./ribalta.exe > second.log 2>&1 || rc=$?
          elapsed=$((SECONDS - start))
          kill "$pid" 2>/dev/null || true
          taskkill //F //IM ribalta.exe > /dev/null 2>&1 || true
          wait "$pid" 2>/dev/null || true
          echo "seconda istanza: exit code $rc dopo ${elapsed}s"; cat second.log
          test "$rc" -eq 0
          test "$elapsed" -lt 15
          grep -q "in esecuzione" second.log

      - name: Portable bundle (make dist)
        run: |
          make dist
          ls -l build/dist/Ribalta build/dist/Ribalta/assets
          ls -l build/Ribalta-windows-x86_64.zip
          # anche l'exe release (LTO, strippato) deve avere le risorse
          rsrc=$(objdump -h build/dist/Ribalta/ribalta.exe | awk '$2 == ".rsrc" { print "0x" $3 }')
          echo ".rsrc size: $((rsrc)) bytes"
          test "$((rsrc))" -gt 65536
          strings -a build/dist/Ribalta/ribalta.exe | grep -F "activeCodePage"

      - name: Test run of the bundle
        run: |
          # fuori dal repo e con un PATH senza /ucrt64/bin: le DLL e gli asset devono venire
          # dalla cartella del bundle (le DLL di sistema stanno in C:/Windows)
          bundle="$PWD/build/dist/Ribalta"
          export XDG_CONFIG_HOME="$(cygpath -m "$(mktemp -d)")" XDG_DATA_HOME="$(cygpath -m "$(mktemp -d)")"
          cd "$(mktemp -d)"
          PATH=/usr/bin:/c/Windows/system32:/c/Windows RIBALTA_DEBUG=1 "$bundle/ribalta.exe" > run.log 2>&1 &
          pid=$!
          sleep 3
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null || true
            taskkill //F //IM ribalta.exe > /dev/null 2>&1 || true
            wait "$pid" 2>/dev/null || true
            cat run.log; echo "::notice::$(tr '\n' '|' < run.log)"
          else
            wait "$pid" || echo "exit code $?" >> run.log
            cat run.log; echo "::error::$(tr '\n' '|' < run.log)"; exit 1
          fi

      - name: Find Inno Setup (install it if missing)
        shell: pwsh
        run: |
          # windows-latest (2022 e 2025) ha gia' Inno Setup 6, installato con Chocolatey (pacchetto
          # innosetup, vedi actions/runner-images); il choco finale e' solo una rete di sicurezza.
          # L'installer di Inno mette ISCC.exe in "Program Files (x86)\Inno Setup 6" senza aggiungerlo al PATH.
          function Find-Iscc {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            foreach ($dir in @("${env:ProgramFiles(x86)}\Inno Setup 6", "$env:ProgramFiles\Inno Setup 6", "$env:LOCALAPPDATA\Programs\Inno Setup 6")) {
              if (Test-Path -LiteralPath "$dir\ISCC.exe") { return "$dir\ISCC.exe" }
            }
            return $null
          }
          $iscc = Find-Iscc
          if ($iscc) {
            Write-Host "Inno Setup already installed"
          } else {
            Write-Host "Inno Setup not found: installing it with Chocolatey"
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) {
            Write-Host "::error::ISCC.exe not found"
            exit 1
          }
          Write-Host "ISCC: $iscc"
          Write-Host "Inno Setup version: $((Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion)"
          # percorso Windows per i passi successivi (make lo converte con cygpath)
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC=$iscc"

      - name: Installer (make installer)
        run: |
          # make installer rifa anche make dist (cartella e zip), poi lancia ISCC con ribalta.iss
          make installer ISCC="$(cygpath -u "$ISCC")"
          ls -l build/Ribalta-windows-x86_64.zip build/Ribalta-windows-x86_64-setup.exe
          # il setup contiene l'exe e le DLL compressi: deve pesare piu' dello zip, non pochi KB
          size=$(stat -c %s build/Ribalta-windows-x86_64-setup.exe)
          echo "setup size: $size bytes"
          test "$size" -gt 1048576

      - name: Installer test (silent, per-user, upgrade, uninstall keeps user data)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Fail($msg) {
            Write-Host "::error::$msg"
            exit 1
          }

          $appId      = '{142E70C6-A819-47F3-B36F-9C7CB97474DB}'   # AppId di ribalta.iss
          $uninstKey  = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\${appId}_is1"
          $version    = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $setup      = Join-Path $PWD 'build\Ribalta-windows-x86_64-setup.exe'
          $dist       = Join-Path $PWD 'build\dist\Ribalta'
          # cartella con uno spazio: l'installer e l'app devono funzionare anche cosi'
          $installDir = Join-Path $env:RUNNER_TEMP 'Ribalta installed'
          $realAppData = $env:APPDATA
          $lnk        = Join-Path $realAppData 'Microsoft\Windows\Start Menu\Programs\Ribalta.lnk'
          $exe        = Join-Path $installDir 'ribalta.exe'
          $unins      = Join-Path $installDir 'unins000.exe'
          $setupLog   = Join-Path $env:RUNNER_TEMP 'ribalta-setup.log'
          $setup2Log  = Join-Path $env:RUNNER_TEMP 'ribalta-setup-upgrade.log'
          $uninsLog   = Join-Path $env:RUNNER_TEMP 'ribalta-uninstall.log'
          if (-not (Test-Path -LiteralPath $setup)) { Fail "setup not found: $setup" }

          # 1. dati dell'utente in %APPDATA%\Ribalta (VM usa e getta: si usa quello vero, e' quello
          #    che il disinstallatore potrebbe toccare); l'app di questo test usa un APPDATA temporaneo
          $dataDir = Join-Path $realAppData 'Ribalta'
          $cfg = Join-Path $dataDir 'config.ini'
          $csv = Join-Path $dataDir 'sessions.csv'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          Set-Content -LiteralPath $cfg -Value 'timer_default_minutes=37' -Encoding ascii
          Set-Content -LiteralPath $csv -Value 'marker-sessions-csv' -Encoding ascii

          function Install-Ribalta($log) {
            $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER',
              "/DIR=`"$installDir`"", "/LOG=`"$log`"")
            Write-Host "setup exit code: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log | Select-Object -Last 60 }
              Fail "setup failed with exit code $($p.ExitCode)"
            }
          }

          # 2. installazione silenziosa per l'utente corrente
          Install-Ribalta $setupLog
          if (-not (Test-Path -LiteralPath $exe)) { Fail "ribalta.exe not installed in $installDir" }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'assets\font.ttf'))) { Fail "assets\font.ttf not installed" }
          if (-not (Test-Path -LiteralPath $unins)) { Fail "unins000.exe not installed" }
          # tutto cio' che c'e' nella cartella portabile deve essere stato installato
          $missing = @(Get-ChildItem -LiteralPath $dist -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($dist.Length).TrimStart('\')
            if (-not (Test-Path -LiteralPath (Join-Path $installDir $rel))) { $rel }
          })
          if ($missing.Count -gt 0) { Fail "files missing from the install dir: $($missing -join ', ')" }
          Write-Host "installed files:"; Get-ChildItem -LiteralPath $installDir -Recurse -File | ForEach-Object { "  " + $_.FullName.Substring($installDir.Length).TrimStart('\') }

          if (-not (Test-Path -LiteralPath $lnk)) { Fail "Start menu shortcut not found: $lnk" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          if ($target -ine $exe) { Fail "shortcut points to '$target', expected '$exe'" }

          if (-not (Test-Path -LiteralPath $uninstKey)) { Fail "uninstall registry key not found: $uninstKey" }
          $reg = Get-ItemProperty -LiteralPath $uninstKey
          Write-Host "DisplayName=$($reg.DisplayName) DisplayVersion=$($reg.DisplayVersion) UninstallString=$($reg.UninstallString)"
          if ($reg.DisplayVersion -ne $version) { Fail "DisplayVersion '$($reg.DisplayVersion)' != VERSION '$version'" }

          # 3. l'app installata parte (APPDATA temporaneo: il config.ini di prova non si tocca)
          $tmpData = Join-Path $env:RUNNER_TEMP 'ribalta-appdata'
          New-Item -ItemType Directory -Force -Path $tmpData | Out-Null
          $env:APPDATA = $tmpData
          $app = Start-Process -FilePath $exe -WorkingDirectory $env:RUNNER_TEMP -PassThru
          $env:APPDATA = $realAppData
          Start-Sleep -Seconds 3
          if ($app.HasExited) { Fail "installed ribalta.exe exited after start (exit code $($app.ExitCode))" }
          Write-Host "installed ribalta.exe is running (pid $($app.Id))"
          Stop-Process -Id $app.Id -Force
          $null = $app.WaitForExit(10000)

          # aggiornamento: lo stesso setup sopra l'installazione esistente (stesso AppId)
          Install-Ribalta $setup2Log
          if (-not (Test-Path -LiteralPath $exe)) { Fail "ribalta.exe missing after the upgrade" }
          if (-not (Test-Path -LiteralPath $uninstKey)) { Fail "uninstall registry key missing after the upgrade" }

          # 4. disinstallazione silenziosa: unins000.exe si copia in %TEMP% e prosegue da la', quindi
          #    si aspetta (al massimo 120 s) che exe, scorciatoia, voce del registro e unins000 spariscano
          $p = Start-Process -FilePath $unins -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$uninsLog`"")
          Write-Host "unins000 exit code: $($p.ExitCode)"
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Date) -lt $deadline) {
            if (-not (Test-Path -LiteralPath $exe) -and -not (Test-Path -LiteralPath $unins) -and
                -not (Test-Path -LiteralPath $lnk) -and -not (Test-Path -LiteralPath $uninstKey)) { break }
            Start-Sleep -Seconds 1
          }
          Write-Host "after uninstall:"
          if (Test-Path -LiteralPath $installDir) {
            Get-ChildItem -LiteralPath $installDir -Recurse | ForEach-Object { "  " + $_.FullName }
          } else {
            Write-Host "  (install dir removed)"
          }
          if (Test-Path -LiteralPath $exe) { Fail "ribalta.exe still there after the uninstall" }
          if (Test-Path -LiteralPath $unins) { Fail "unins000.exe still there after the uninstall" }
          if (Test-Path -LiteralPath $lnk) { Fail "Start menu shortcut still there after the uninstall" }
          if (Test-Path -LiteralPath $uninstKey) { Fail "uninstall registry key still there after the uninstall" }

          # i dati dell'utente restano, intatti
          if (-not (Test-Path -LiteralPath $cfg)) { Fail "config.ini removed by the uninstaller: user data must be kept" }
          if (-not (Test-Path -LiteralPath $csv)) { Fail "sessions.csv removed by the uninstaller: user data must be kept" }
          if ((Get-Content -LiteralPath $cfg -Raw).Trim() -ne 'timer_default_minutes=37') { Fail "config.ini changed by the install or uninstall" }
          if ((Get-Content -LiteralPath $csv -Raw).Trim() -ne 'marker-sessions-csv') { Fail "sessions.csv changed by the install or uninstall" }
          Write-Host "OK: installed, started, upgraded and uninstalled; %APPDATA%\Ribalta kept"

      - name: Installer logs (on failure)
        if: failure()
        shell: pwsh
        run: |
          foreach ($name in 'ribalta-setup.log', 'ribalta-setup-upgrade.log', 'ribalta-uninstall.log') {
            $f = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $f) {
              Write-Host "::group::$name"
              Get-Content -LiteralPath $f
              Write-Host "::endgroup::"
            }
          }

      - uses: actions/upload-artifact@v6
        with:
          name: Ribalta-windows-x86_64
          path: build/Ribalta-windows-x86_64.zip

      - uses: actions/upload-artifact@v6
        with:
          name: Ribalta-windows-x86_64-setup
          path: build/Ribalta-windows-x86_64-setup.exe

      - name: Attach to the release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/Ribalta-windows-x86_64.zip
            build/Ribalta-windows-x86_64-setup.exe
