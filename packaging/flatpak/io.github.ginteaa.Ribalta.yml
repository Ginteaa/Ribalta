# Flatpak di Ribalta. Il runtime freedesktop 25.08 contiene già SDL3, SDL3_ttf, fontconfig e
# notify-send: nessun modulo extra da compilare.
#   flatpak-builder --user --install --force-clean build-flatpak packaging/flatpak/io.github.ginteaa.Ribalta.yml
id: io.github.ginteaa.Ribalta
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ribalta
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  # app_id Wayland / classe X11 uguali all'id dell'app (icona e nome giusti nel launcher)
  - --env=SDL_APP_ID=io.github.ginteaa.Ribalta
modules:
  # FreeType e SDL3_ttf statici e minimi: quelli del runtime tirano dentro all'avvio harfbuzz, glib,
  # pcre2, graphite, png, brotli… (~3 MB di RAM in più). Ribalta disegna solo cifre ed etichette
  # latine: niente shaping (harfbuzz), niente emoji a colori (png/plutosvg), niente font compressi.
  - name: freetype
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DFT_DISABLE_HARFBUZZ=ON
      - -DFT_DISABLE_PNG=ON
      - -DFT_DISABLE_BROTLI=ON
      - -DFT_DISABLE_BZIP2=ON
      - -DFT_DISABLE_ZLIB=ON
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://download.savannah.gnu.org/releases/freetype/freetype-2.13.3.tar.xz
        sha256: 0550350666d427c74daeb85d5ac7bb353acba5f76956395995311a9c6f063289

  - name: SDL3_ttf
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DSDLTTF_VENDORED=OFF
      - -DSDLTTF_HARFBUZZ=OFF
      - -DSDLTTF_PLUTOSVG=OFF
      - -DSDLTTF_SAMPLES=OFF
    cleanup:
      - '*'
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL_ttf.git
        tag: release-3.2.2
        commit: a1ce3670aec736ecbf0936c43f2f0cc53aa61e5b
        disable-submodules: true

  - name: ribalta
    buildsystem: simple
    build-options:
      # variabili d'ambiente: il Makefile le estende (release aggiunge -flto -s)
      ldflags: -Wl,--as-needed
      env:
        # SDL3_ttf è statico: pkg-config --static aggiunge le sue dipendenze private (freetype)
        PKGFLAGS: --static
    build-commands:
      - make release
      - make install-files PREFIX=/app APPID=io.github.ginteaa.Ribalta
      - install -Dm644 packaging/flatpak/io.github.ginteaa.Ribalta.metainfo.xml /app/share/metainfo/io.github.ginteaa.Ribalta.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - build-flatpak
          - .flatpak-builder
          - ribalta
